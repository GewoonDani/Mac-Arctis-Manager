name: macOS arm64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - run: Scripts/test.sh
      - run: Scripts/build.sh release
      - name: Archive local artifacts
        run: ditto -c -k --keepParent dist/release Mac-Arctis-Manager-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mac-Arctis-Manager-arm64
          path: Mac-Arctis-Manager-arm64.zip
      - name: Archive release app
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: ditto -c -k --keepParent 'dist/release/Mac Arctis Manager.app' Mac-Arctis-Manager.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-assets
          path: |
            Mac-Arctis-Manager.zip
            dist/release/ArctisAudio.pkg
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-from-tag Mac-Arctis-Manager.zip dist/release/ArctisAudio.pkg
